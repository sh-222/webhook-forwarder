[project]
name = "webhook-forwarder"
version = "0.1.0"
description = "Async Rate-Limited Webhook Forwarder & Dead-Letter Queue"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "structlog>=26.1.0",
]

[project.scripts]
webhook-forwarder = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "domain", "services", "adapters", "presentation", "main.py"]
